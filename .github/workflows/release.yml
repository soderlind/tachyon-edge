name: Worker Dry Run

on:
  push:
    tags:
      - "**"
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run check:worker
      - run: npm exec -- wrangler deploy --dry-run
        env:
          CLOUDFLARE_SEND_METRICS: "false"
